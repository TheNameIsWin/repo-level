name: Web Deploy

on:
  pull_request:

jobs:
  detect-web:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - '**/web/**'
              - 'web/**'

  deploy-web:
    needs: detect-web
    if: needs.detect-web.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd web && npm ci
      - run: cd web && npm run lint && npm test
