name: Web CI

on:
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Detect Web changes
      - name: Detect Web changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '^web/|/web/' || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # PASS/FAIL Mode
      - name: Control mode
        id: control
        run: |
          MSG="${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}"
          if echo "$MSG" | grep -qi "fail-test"; then
            echo "mode=fail" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qi "pass-test"; then
            echo "mode=pass" >> $GITHUB_OUTPUT
          else
            echo "mode=normal" >> $GITHUB_OUTPUT
          fi

      # No changes
      - name: No Web changes — skipping tests
        if: steps.detect.outputs.changed == 'false'
        run: echo "No Web files changed, skipping tests."
        
      # Force pass
      - name: Force pass
        if: steps.control.outputs.mode == 'pass'
        run: echo "Passing intentionally"

      # Actual Web build/tests
      - name: Run Web Build/Test
        if: steps.detect.outputs.changed == 'true' && steps.control.outputs.mode == 'normal'
        run: |
          cd web
          npm install
          npm run build
