name: API Build

on:
  pull_request:

jobs:
  detect-api:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - '**/api/**'
              - 'api/**'

  build-api:
    needs: detect-api
    if: needs.detect-api.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd api && npm ci
      - run: cd api && npm run build && npm test
