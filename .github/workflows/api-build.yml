name: API Build

on:
  pull_request:
    paths:
      - '**/api/**'  # Only if API files changed

jobs:
  build-api:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'api/')  # Extra condition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci  # Your API deps
      - name: Run Build & Tests
        run: npm run build && npm test  # Fail if tests fail