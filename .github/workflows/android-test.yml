name: Android Test

on:
  pull_request:

jobs:
  detect-android:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - '**/android/**'
              - 'android/**'

  test-android:
    needs: detect-android
    if: needs.detect-android.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cd android && ./gradlew test
