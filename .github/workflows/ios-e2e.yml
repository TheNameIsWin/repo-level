name: iOS E2E

on:
  pull_request:

jobs:
  ios-tests:
    runs-on: macos-latest
    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Detect changes manually (NO SKIP!)
      - name: Detect iOS changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '^ios/|/ios/' || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 3. If no changes → do not run test, just PASS
      - name: No iOS changes found — skipping tests
        if: steps.detect.outputs.changed == 'false'
        run: echo "No iOS files changed, skipping tests."

      # 4. RUN TEST ONLY WHEN CHANGED
      - name: Run iOS Tests
        if: steps.detect.outputs.changed == 'true'
        run: |
          cd ios
          xcodebuild test \
            -scheme YourApp \
            -destination "platform=iOS Simulator,name=iPhone 15"
